<svg width="268" height="64" viewBox="0 0 268 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="icon-grad" x1="0" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
  </defs>

  <!-- Left Icon: Interconnected O-network (scaled to fill space) -->
  <g transform="translate(-9.6, -9.6) scale(1.3)">
    <!-- Outer ring of 'O' -->
    <circle cx="32" cy="32" r="22" stroke="url(#icon-grad)" stroke-width="3" stroke-dasharray="138" stroke-dashoffset="15" opacity="0.9"/>
    
    <!-- Outer network node lines -->
    <line x1="32" y1="10" x2="48" y2="22" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
    <line x1="48" y1="22" x2="42" y2="46" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
    <line x1="42" y1="46" x2="20" y2="42" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
    <line x1="20" y1="42" x2="16" y2="20" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
    <line x1="16" y1="20" x2="32" y2="10" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
    
    <!-- Internal connections representing data model relations -->
    <line x1="32" y1="10" x2="42" y2="46" stroke="#ffffff" stroke-dasharray="2 2" stroke-width="1" opacity="0.7" />
    <line x1="16" y1="20" x2="42" y2="46" stroke="#ffffff" stroke-dasharray="2 2" stroke-width="1" opacity="0.7" />
    <line x1="20" y1="42" x2="48" y2="22" stroke="#ffffff" stroke-dasharray="2 2" stroke-width="1" opacity="0.7" />
    <line x1="32" y1="32" x2="32" y2="10" stroke="#ffffff" stroke-width="1.5" />
    <line x1="32" y1="32" x2="48" y2="22" stroke="#ffffff" stroke-width="1.5" />
    <line x1="32" y1="32" x2="42" y2="46" stroke="#ffffff" stroke-width="1.5" />
    <line x1="32" y1="32" x2="20" y2="42" stroke="#ffffff" stroke-width="1.5" />
    <line x1="32" y1="32" x2="16" y2="20" stroke="#ffffff" stroke-width="1.5" />

    <!-- Nodes (circles) representing network elements -->
    <circle cx="32" cy="10" r="3.5" fill="#00f2fe" stroke="#ffffff" stroke-width="1" />
    <circle cx="48" cy="22" r="3.5" fill="#4facfe" stroke="#ffffff" stroke-width="1" />
    <circle cx="42" cy="46" r="3.5" fill="#00f2fe" stroke="#ffffff" stroke-width="1" />
    <circle cx="20" cy="42" r="3.5" fill="#4facfe" stroke="#ffffff" stroke-width="1" />
    <circle cx="16" cy="20" r="3.5" fill="#00f2fe" stroke="#ffffff" stroke-width="1" />
    <circle cx="32" cy="32" r="5" fill="#ffffff" stroke="url(#icon-grad)" stroke-width="1.5" />
  </g>

  <!-- Right Text: O域数据模型 (only Chinese, enlarged and centered) -->
  <text x="72" y="44" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="32" font-weight="bold" letter-spacing="1">O域数据模型</text>
</svg>
